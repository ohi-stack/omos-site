<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 686" role="img" aria-labelledby="title desc">
  <title id="title">OMOS — OneGodian Metaphysical Operating System</title>
  <desc id="desc">Wide metallic-gold OMOS logo with a star flare, globe motif, and full system name.</desc>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4a8"/>
      <stop offset="0.16" stop-color="#ffd54f"/>
      <stop offset="0.42" stop-color="#b86700"/>
      <stop offset="0.63" stop-color="#fff2a0"/>
      <stop offset="0.82" stop-color="#c47600"/>
      <stop offset="1" stop-color="#5f2d00"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b3c00"/>
      <stop offset="0.2" stop-color="#ffcf3a"/>
      <stop offset="0.5" stop-color="#fff0a0"/>
      <stop offset="0.8" stop-color="#d98700"/>
      <stop offset="1" stop-color="#6b3300"/>
    </linearGradient>
    <radialGradient id="flare" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.18" stop-color="#fff9c9"/>
      <stop offset="0.42" stop-color="#ffd54b" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".65"/>
    </filter>
    <clipPath id="globeClip"><circle cx="1338" cy="316" r="143"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <text x="40" y="505" font-family="Georgia, 'Times New Roman', serif" font-size="500" font-weight="700" letter-spacing="-18" fill="url(#gold)" stroke="#2b1200" stroke-width="8" paint-order="stroke">OMOS</text>
  </g>

  <g clip-path="url(#globeClip)">
    <rect x="1195" y="173" width="286" height="286" fill="#070707"/>
    <circle cx="1338" cy="316" r="142" fill="#090909" stroke="#f4bd28" stroke-width="5"/>
    <g fill="none" stroke="#b87a13" stroke-width="3" opacity=".75">
      <ellipse cx="1338" cy="316" rx="142" ry="50"/>
      <ellipse cx="1338" cy="316" rx="142" ry="92"/>
      <ellipse cx="1338" cy="316" rx="52" ry="142"/>
      <ellipse cx="1338" cy="316" rx="93" ry="142"/>
      <line x1="1196" y1="316" x2="1480" y2="316"/>
      <line x1="1338" y1="174" x2="1338" y2="458"/>
    </g>
    <g fill="#d99818" opacity=".96">
      <path d="M1266 235l30-21 32 5 10 16 22 6 9 18-18 8-21-5-20 16-23-7-18-17z"/>
      <path d="M1305 283l34 4 18 24 18 9 5 22-14 25-7 31-18 18-21-12-9-30-18-19-6-31 18-41z"/>
      <path d="M1382 238l28-4 27 15 19 3 13 21-11 10-20-4-17 9-17-7-15 4-13-12 6-35z"/>
      <path d="M1244 314l16 3 8 17-8 16-15-3-10-15z"/>
      <path d="M1414 369l20 4 8 15-14 12-18-7z"/>
    </g>
  </g>
  <circle cx="1338" cy="316" r="151" fill="none" stroke="url(#goldSoft)" stroke-width="20"/>

  <g filter="url(#glow)">
    <circle cx="332" cy="118" r="66" fill="url(#flare)"/>
    <path d="M332 16v204M230 118h204M262 48l140 140M402 48L262 188" stroke="#fff7c2" stroke-width="9" stroke-linecap="round" opacity=".9"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="1338" cy="316" r="36" fill="url(#flare)" opacity=".85"/>
    <path d="M1338 278v76M1300 316h76" stroke="#fff9d1" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="1936" y="150" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="url(#gold)">TM</text>

  <g transform="translate(35 585)">
    <line x1="0" y1="28" x2="210" y2="28" stroke="url(#goldSoft)" stroke-width="7"/>
    <line x1="1780" y1="28" x2="1970" y2="28" stroke="url(#goldSoft)" stroke-width="7"/>
    <text x="238" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="55" font-weight="700" letter-spacing="2" fill="url(#gold)" stroke="#3c1d00" stroke-width="2" paint-order="stroke">ONEGODIAN METAPHYSICAL OPERATING SYSTEM™</text>
  </g>
</svg>