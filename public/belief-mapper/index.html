<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OMOS Belief Mapper</title>
  <link rel="stylesheet" href="/omos-ui.css">
  <style>
    body{background:#050507;color:#f5f1e8;font-family:Inter,system-ui,sans-serif;margin:0}.bm-shell{max-width:980px;margin:0 auto;padding:56px 22px 90px}.bm-badge{display:inline-flex;padding:9px 14px;border:1px solid rgba(216,179,90,.35);border-radius:999px;color:#f0d98a;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.bm-card{margin-top:28px;padding:28px;border:1px solid rgba(216,179,90,.22);border-radius:22px;background:#070607;box-shadow:0 18px 44px rgba(0,0,0,.22)}h1{font-size:clamp(38px,7vw,68px);line-height:1.02;margin:20px 0 14px}.muted{color:rgba(245,241,232,.75)}.progress{height:8px;background:#17121f;border-radius:999px;overflow:hidden;margin:22px 0}.progress span{display:block;height:100%;background:linear-gradient(90deg,#d8b35a,#6f3cff);width:0}.question{font-size:26px;font-weight:750;margin:8px 0 20px}.options{display:grid;gap:12px}.option{border:1px solid rgba(245,241,232,.12);background:#15111f;color:#f5f1e8;padding:15px 16px;border-radius:14px;text-align:left;cursor:pointer}.option:hover,.option[aria-pressed="true"]{border-color:#d8b35a;background:#17121f}.actions{display:flex;gap:12px;justify-content:space-between;margin-top:24px}.btn{border:1px solid rgba(216,179,90,.5);background:transparent;color:#f5f1e8;padding:12px 18px;border-radius:12px;font-weight:800;cursor:pointer}.btn.primary{background:#d8b35a;color:#050507}.btn:disabled{opacity:.45;cursor:not-allowed}.result-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:18px}.dimension{padding:16px;border:1px solid rgba(245,241,232,.1);border-radius:14px;background:#15111f}.stage{font-size:42px;margin:6px 0}.notice{margin-top:22px;padding:16px;border-left:3px solid #d8b35a;background:#15111f;color:rgba(245,241,232,.82)}
  </style>
</head>
<body>
  <main class="bm-shell">
    <div class="bm-badge">OMOS • Identity • Belief Mapper • Voluntary Reflection</div>
    <h1>Discover where your existing beliefs intersect with the OneGodian framework.</h1>
    <p class="muted">Answer seven questions. Understand your beliefs. See where you stand. Discover what comes next.</p>
    <section class="bm-card" id="mapper" aria-live="polite">
      <div id="question-view">
        <div class="muted" id="counter">Question 1 of 7</div>
        <div class="progress"><span id="progress-bar"></span></div>
        <div class="question" id="question"></div>
        <div class="options" id="options"></div>
        <div class="actions"><button class="btn" id="back" type="button">Back</button><button class="btn primary" id="next" type="button" disabled>Next</button></div>
      </div>
      <div id="result-view" hidden></div>
    </section>
  </main>
  <script src="/belief-mapper/app.js" defer></script>
</body>
</html>
